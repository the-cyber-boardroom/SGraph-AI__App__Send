name: Deploy User UI to S3

# Publishes v0.3.x user UI to S3.
# v0.3.0 is a self-contained IFD major version — no overlay chain needed.
# CloudFront separation: /api/* → Lambda origin, /* → S3 static files.
#
# IFD deployment model (v0.3.0+):
#   v0.3.0 is the base — deployed with --clean-latest to replace v0.2.x.
#   Future v0.3.x patches overlay onto latest/ in version order.
#
# S3 path isolation by branch/environment:
#   websites/sgraph-send/dev/    — dev branch (automatic)
#   websites/sgraph-send/main/   — main branch (automatic)
#   websites/sgraph-send/prod/   — production (manual dispatch)
#
# Environments:
#   - dev:        dev.send.sgraph.ai   (default — push to dev branch)
#   - main:       main.send.sgraph.ai  (push to main branch)
#   - production: send.sgraph.ai       (manual dispatch)

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'sgraph_ai_app_send__ui__user/v0/v0.3/**'
      - 'sgraph_ai_app_send__ui__user/dev/**'
      - 'sgraph_ai_app_send/version'
      - 'scripts/generate_send_i18n_pages.py'
      - 'scripts/inject_build_version.py'
      - '.github/workflows/deploy-ui-user.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'dev'
        type: choice
        options:
          - dev
          - main
          - production
      clean_latest:
        description: 'Clean latest/ before deploying (removes stale files from previous versions)'
        required: false
        default: true
        type: boolean

concurrency:
  group: "ui-user-deploy-${{ inputs.environment || github.ref_name || 'dev' }}"
  cancel-in-progress: false

env:
  AWS_REGION      : eu-west-2
  UI_BASE_DIR     : sgraph_ai_app_send__ui__user/v0/v0.3

jobs:
  deploy:
    name: "Publish UI to S3 + CloudFront (${{ inputs.environment || github.ref_name || 'dev' }})"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment || (github.ref_name == 'main' && 'main') || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Discover IFD versions
        id: discover
        run: |
          # Find all v0.3.x directories, sort by version number
          VERSIONS=$(ls -d ${{ env.UI_BASE_DIR }}/v0.3.* 2>/dev/null | xargs -n1 basename | sort -t. -k3 -n || true)
          echo "Found v0.3.x versions:"
          echo "$VERSIONS"
          echo "versions=$(echo $VERSIONS | tr '\n' ' ')" >> $GITHUB_OUTPUT

          # Count for later steps
          COUNT=$(echo "$VERSIONS" | wc -w)
          echo "count=$COUNT" >> $GITHUB_OUTPUT

          # First version (base — gets --clean-latest)
          FIRST=$(echo "$VERSIONS" | head -n1 | xargs)
          echo "first=$FIRST" >> $GITHUB_OUTPUT

      - name: Inject build version into all IFD versions
        run: |
          for VERSION in ${{ steps.discover.outputs.versions }}; do
            echo "Injecting build version into $VERSION"
            python scripts/inject_build_version.py --version "$VERSION"
          done

      - name: Generate i18n locale pages for all IFD versions
        run: |
          for VERSION in ${{ steps.discover.outputs.versions }}; do
            echo "Generating i18n pages for $VERSION"
            python scripts/generate_send_i18n_pages.py --version "$VERSION"
          done

      - name: Check AWS credentials
        id: check-creds
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "has-credentials=false" >> $GITHUB_OUTPUT
            echo "WARNING: AWS credentials not configured — skipping deployment"
          else
            echo "has-credentials=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        if: steps.check-creds.outputs.has-credentials == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id     : ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key : ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region            : ${{ env.AWS_REGION }}

      - name: Resolve deployment environment
        id: env
        run: |
          DEPLOY_ENV="${{ inputs.environment || github.ref_name }}"
          if [ "$DEPLOY_ENV" == "production" ]; then
            echo "deploy_env=prod" >> $GITHUB_OUTPUT
            echo "dist_id=${{ secrets.SGRAPH_SEND__CLOUDFRONT_DISTRIBUTION_ID }}" >> $GITHUB_OUTPUT
            echo "Deploying to PRODUCTION (send.sgraph.ai) → S3: websites/sgraph-send/prod/"
          elif [ "$DEPLOY_ENV" == "main" ]; then
            echo "deploy_env=main" >> $GITHUB_OUTPUT
            echo "dist_id=${{ secrets.SGRAPH_SEND__DEV__CLOUDFRONT_DISTRIBUTION_ID }}" >> $GITHUB_OUTPUT
            echo "Deploying to MAIN → S3: websites/sgraph-send/main/"
          else
            echo "deploy_env=dev" >> $GITHUB_OUTPUT
            echo "dist_id=${{ secrets.SGRAPH_SEND__DEV__CLOUDFRONT_DISTRIBUTION_ID }}" >> $GITHUB_OUTPUT
            echo "Deploying to DEV (dev.send.sgraph.ai) → S3: websites/sgraph-send/dev/"
          fi

      - name: Deploy v0.3.x to S3
        if: steps.check-creds.outputs.has-credentials == 'true'
        run: |
          VERSIONS=(${{ steps.discover.outputs.versions }})
          TOTAL=${#VERSIONS[@]}
          FIRST="${{ steps.discover.outputs.first }}"
          CLEAN_REQUESTED="${{ inputs.clean_latest }}"

          for i in "${!VERSIONS[@]}"; do
            VERSION="${VERSIONS[$i]}"
            SOURCE_DIR="${{ env.UI_BASE_DIR }}/$VERSION"
            STEP=$((i + 1))
            echo ""
            echo "=== Deploying $VERSION ($SOURCE_DIR) [$STEP/$TOTAL] ==="

            EXTRA_FLAGS=""

            # Scoped clean: the legacy user tree shares the sgraph-send latest/
            # prefix with the v0.4.x share (/en-gb/share/) and open (/en-gb/open/)
            # trees. A full --clean-latest here would delete those sibling trees —
            # the cause of the site-wide 404. Clean only the URL slices this tree
            # owns: the root redirect, the /en-gb/ landing, and the legacy receiver
            # pages. Never touch en-gb/share, en-gb/open, or _common.
            # For push-triggered deploys, always clean on first version.
            # For manual dispatch, respect the clean_latest input.
            if [ "$VERSION" == "$FIRST" ]; then
              if [ "$CLEAN_REQUESTED" != "false" ]; then
                EXTRA_FLAGS="--clean-prefixes index.html en-gb/index.html en-gb/welcome en-gb/browse en-gb/download en-gb/gallery en-gb/v en-gb/view en-gb/s"
                echo "  → Cleaning the legacy user tree's own slices only (root + /en-gb/ pages)"
              fi
            fi

            # Last version: include CloudFront invalidation and version file
            if [ "$STEP" -eq "$TOTAL" ]; then
              EXTRA_FLAGS="$EXTRA_FLAGS --cloudfront-distribution-id ${{ steps.env.outputs.dist_id }} --version-file sgraph_ai_app_send/version"
            fi

            python scripts/deploy_static_site.py \
              --site sgraph-send \
              --version "$VERSION" \
              --source-dir "$SOURCE_DIR" \
              --bucket ${{ secrets.SGRAPH_SEND__UI_S3_BUCKET }} \
              --region ${{ env.AWS_REGION }} \
              --deploy-env ${{ steps.env.outputs.deploy_env }} \
              --skip-validation \
              $EXTRA_FLAGS
          done

          echo ""
          echo "=== Deployed $TOTAL version(s): ${VERSIONS[*]} ==="

      - name: Deploy /dev/ tools to S3 latest/dev/
        if: steps.check-creds.outputs.has-credentials == 'true'
        run: |
          DEV_SOURCE_DIR="sgraph_ai_app_send__ui__user/dev/"
          DEV_BUCKET_PATH="s3://${{ secrets.SGRAPH_SEND__UI_S3_BUCKET }}/websites/sgraph-send/${{ steps.env.outputs.deploy_env }}/latest/dev/"

          if [ ! -d "$DEV_SOURCE_DIR" ]; then
            echo "  SKIP: $DEV_SOURCE_DIR does not exist"
            exit 0
          fi

          echo ""
          echo "=== Syncing /dev/ tools ==="
          echo "  source: $DEV_SOURCE_DIR"
          echo "  target: $DEV_BUCKET_PATH"

          # HTML gets a short cache so redirects + updates roll out quickly.
          aws s3 sync "$DEV_SOURCE_DIR" "$DEV_BUCKET_PATH" \
            --exclude "*" --include "*.html" \
            --cache-control "public, max-age=300" \
            --content-type "text/html; charset=utf-8"

          # CSS / JS / JSON get a 1-day cache (CloudFront invalidation clears stale on each deploy).
          aws s3 sync "$DEV_SOURCE_DIR" "$DEV_BUCKET_PATH" \
            --exclude "*" --include "*.css" --include "*.js" --include "*.json" \
            --cache-control "public, max-age=86400"

          # Everything else (images, fonts, misc) — short cache as a safe default.
          aws s3 sync "$DEV_SOURCE_DIR" "$DEV_BUCKET_PATH" \
            --exclude "*.html" --exclude "*.css" --exclude "*.js" --exclude "*.json" \
            --cache-control "public, max-age=300"

          echo "=== /dev/ tools deployed ==="
