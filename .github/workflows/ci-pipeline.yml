name: CI Pipeline (Base)

on:
  workflow_call:
    inputs:
      git_branch:
        required: true
        type: string
      release_type:
        required: false
        type: string
        default: ""
      should_increment_tag:
        required: false
        type: boolean
        default: false
      should_publish_pypi:
        required: false
        type: boolean
        default: false
      should_publish_dockerhub:
        required: false
        type: boolean
        default: false
      target_deploy:
        required: true
        type: string
    secrets:
      AWS_SECRET_ACCESS_KEY:
        required: false
      AWS_DEFAULT_REGION:
        required: false
      AWS_ACCOUNT_ID:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      FAST_API__AUTH__API_KEY__NAME:
        required: false
      FAST_API__AUTH__API_KEY__VALUE:
        required: false
      CACHE__SERVICE__BUCKET_NAME:
        required: false
      SGRAPH_SEND__ADMIN__BASE_URL:
        required: false
      SGRAPH_SEND__ADMIN__API_KEY__NAME:
        required: false
      SGRAPH_SEND__ADMIN__API_KEY__VALUE:
        required: false
      SGRAPH_SEND__CLOUDFRONT_DISTRIBUTION_ID:
        required: false
      SGRAPH_SEND__LAMBDA_USER_NAME:
        required: false
      SGRAPH_SEND__LAMBDA_ADMIN_NAME:
        required: false
      SGRAPH_SEND__S3_TRANSFERS_BUCKET:
        required: false
      SGRAPH_SEND__S3_CACHE_BUCKET:
        required: false
      SGRAPH_SEND__S3_FILTER_ID:
        required: false
      SGRAPH_SEND__AWS_REGION:
        required: false
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

env:
  PACKAGE_NAME: 'sgraph_ai_app_send'
  DOCKERHUB_IMAGE: 'diniscruz/sg-send-vault'

jobs:
  run-tests:
    name: "Run Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "run-tests"
        uses: owasp-sbot/OSBot-GitHub-Actions/.github/actions/pytest__run-tests@dev
        with:
          test_target: "tests/unit"

  increment-tag:
    name: Increment Tag
    runs-on: ubuntu-latest
    needs: [run-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Increment Tag
        if: inputs.should_increment_tag
        uses: owasp-sbot/OSBot-GitHub-Actions/.github/actions/git__increment-tag@dev
        with:
          release_type: ${{ inputs.release_type }}

  publish-to-pypi:
    if: inputs.should_publish_pypi && needs.increment-tag.result == 'success'
    name: "Publish to: PYPI"
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    needs: [increment-tag]
    steps:
      - uses: actions/checkout@v4
      - name: Git Update Current Branch
        uses: owasp-sbot/OSBot-GitHub-Actions/.github/actions/git__update_branch@dev
      - name: publish-to-pypi
        uses: owasp-sbot/OSBot-GitHub-Actions/.github/actions/pypi__publish@dev

  check-aws-credentials:
    name: Check AWS Credentials
    runs-on: ubuntu-latest
    needs:
      - run-tests
    outputs:
      has-credentials: ${{ steps.check.outputs.has-credentials }}
    steps:
      - name: Check if AWS credentials are configured
        id: check
        run: |
          if [[ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ]] && \
             [[ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]] && \
             [[ -n "${{ secrets.AWS_DEFAULT_REGION }}" ]] && \
             [[ -n "${{ secrets.AWS_ACCOUNT_ID }}" ]]; then
            echo "has-credentials=true" >> $GITHUB_OUTPUT
            echo "✅ AWS credentials are configured"
          else
            echo "has-credentials=false" >> $GITHUB_OUTPUT
            echo "⚠️  AWS credentials are not configured - deployment will be skipped"
          fi

  aws-deploy-lambda__admin:
    if: needs.check-aws-credentials.outputs.has-credentials == 'true' && inputs.target_deploy != 'main' && inputs.target_deploy != 'prod'
    name: Admin - Deploy AWS Lambda
    runs-on: ubuntu-latest
    needs: [check-aws-credentials, increment-tag]  # Now this works because increment-tag always runs
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Service Lambda function
        uses: ./.github/actions/aws__deploy__lambda
        env:
          AWS_SECRET_ACCESS_KEY                        : ${{ secrets.AWS_SECRET_ACCESS_KEY                        }}
          AWS_DEFAULT_REGION                           : ${{ secrets.AWS_DEFAULT_REGION                           }}
          AWS_ACCOUNT_ID                               : ${{ secrets.AWS_ACCOUNT_ID                               }}
          AWS_ACCESS_KEY_ID                            : ${{ secrets.AWS_ACCESS_KEY_ID                            }}
          FAST_API__AUTH__API_KEY__NAME                : ${{ secrets.FAST_API__AUTH__API_KEY__NAME                }}
          FAST_API__AUTH__API_KEY__VALUE               : ${{ secrets.FAST_API__AUTH__API_KEY__VALUE               }}
          URL__TARGET_SERVER__CACHE_SERVICE            : ${{ secrets.AUTH__TARGET_SERVER__CACHE_SERVICE__BASE_URL }}
          CACHE__SERVICE__BUCKET_NAME                  : ${{ secrets.CACHE__SERVICE__BUCKET_NAME                  }}
          SGRAPH_SEND__CLOUDFRONT_DISTRIBUTION_ID      : ${{ secrets.SGRAPH_SEND__CLOUDFRONT_DISTRIBUTION_ID      }}
          SGRAPH_SEND__LAMBDA_USER_NAME                : ${{ secrets.SGRAPH_SEND__LAMBDA_USER_NAME                }}
          SGRAPH_SEND__LAMBDA_ADMIN_NAME               : ${{ secrets.SGRAPH_SEND__LAMBDA_ADMIN_NAME               }}
          SGRAPH_SEND__S3_TRANSFERS_BUCKET             : ${{ secrets.SGRAPH_SEND__S3_TRANSFERS_BUCKET             }}
          SGRAPH_SEND__S3_CACHE_BUCKET                 : ${{ secrets.SGRAPH_SEND__S3_CACHE_BUCKET                 }}
          SGRAPH_SEND__S3_FILTER_ID                    : ${{ secrets.SGRAPH_SEND__S3_FILTER_ID                    }}
          SGRAPH_SEND__AWS_REGION                      : ${{ secrets.SGRAPH_SEND__AWS_REGION                      }}
        with:
          target      : ${{ inputs.target_deploy }}
          lambda_type : 'Admin'

  aws-deploy-lambda__user:
    if: needs.check-aws-credentials.outputs.has-credentials == 'true'
    name: User - Deploy AWS Lambda
    runs-on: ubuntu-latest
    needs: [ check-aws-credentials, increment-tag ]  # Now this works because increment-tag always runs
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Service Lambda function
        uses: ./.github/actions/aws__deploy__lambda
        env:
          AWS_SECRET_ACCESS_KEY                        : ${{ secrets.AWS_SECRET_ACCESS_KEY                        }}
          AWS_DEFAULT_REGION                           : ${{ secrets.AWS_DEFAULT_REGION                           }}
          AWS_ACCOUNT_ID                               : ${{ secrets.AWS_ACCOUNT_ID                               }}
          AWS_ACCESS_KEY_ID                            : ${{ secrets.AWS_ACCESS_KEY_ID                            }}
          FAST_API__AUTH__API_KEY__NAME                : ${{ secrets.FAST_API__AUTH__API_KEY__NAME                }}
          FAST_API__AUTH__API_KEY__VALUE               : ${{ secrets.FAST_API__AUTH__API_KEY__VALUE               }}
          URL__TARGET_SERVER__CACHE_SERVICE            : ${{ secrets.AUTH__TARGET_SERVER__CACHE_SERVICE__BASE_URL }}
          SGRAPH_SEND__ADMIN__BASE_URL                 : ${{ secrets.SGRAPH_SEND__ADMIN__BASE_URL                 }}
          SGRAPH_SEND__ADMIN__API_KEY__NAME            : ${{ secrets.SGRAPH_SEND__ADMIN__API_KEY__NAME            }}
          SGRAPH_SEND__ADMIN__API_KEY__VALUE           : ${{ secrets.SGRAPH_SEND__ADMIN__API_KEY__VALUE           }}
          CACHE__SERVICE__BUCKET_NAME                  : ${{ secrets.CACHE__SERVICE__BUCKET_NAME                  }}
        with:
          target     : ${{ inputs.target_deploy }}
          lambda_type: 'User'

  publish-to-dockerhub:
    if: inputs.should_publish_dockerhub && needs.run-tests.result == 'success' && (needs.increment-tag.result == 'success' || needs.increment-tag.result == 'skipped')
    name: "Publish to: Docker Hub"
    runs-on: ubuntu-latest
    needs: [run-tests, increment-tag]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - uses: actions/checkout@v4

      - name: Git Update Current Branch
        uses: owasp-sbot/OSBot-GitHub-Actions/.github/actions/git__update_branch@dev

      - name: Prepare platform pair
        run: echo "PLATFORM_PAIR=${{ matrix.platform }}" | sed 's|/|-|g' >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Each matrix job builds ONE platform and pushes it by digest (no tag yet).
      # The merge job below assembles the per-platform digests into one tagged
      # manifest list. This runs amd64 and arm64 in parallel instead of building
      # arm64 under QEMU sequentially after amd64.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: sgraph_ai_app_send__docker/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.DOCKERHUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: dockerhub-digest-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-to-dockerhub-manifest:
    if: inputs.should_publish_dockerhub && needs.publish-to-dockerhub.result == 'success'
    name: "Publish to: Docker Hub (manifest)"
    runs-on: ubuntu-latest
    needs: [publish-to-dockerhub]
    steps:
      - uses: actions/checkout@v4

      - name: Git Update Current Branch
        uses: owasp-sbot/OSBot-GitHub-Actions/.github/actions/git__update_branch@dev

      - name: Read version
        id: version
        run: |
          VER=$(cat sgraph_ai_app_send/version)
          echo "tag=${VER}" >> $GITHUB_OUTPUT
          echo "Detected version: ${VER}"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: dockerhub-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Assemble the per-platform digests into one multi-arch manifest list.
      # Every successful publish updates :latest in addition to its immutable
      # version tag — both dev and main pushes share :latest.
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.DOCKERHUB_IMAGE }}:${{ steps.version.outputs.tag }} \
            -t ${{ env.DOCKERHUB_IMAGE }}:latest \
            $(printf '${{ env.DOCKERHUB_IMAGE }}@sha256:%s ' *)

      - name: Inspect manifest
        run: docker buildx imagetools inspect ${{ env.DOCKERHUB_IMAGE }}:${{ steps.version.outputs.tag }}

      - name: Smoke test
        run: |
          IMG=${{ env.DOCKERHUB_IMAGE }}:${{ steps.version.outputs.tag }}
          docker run -d --name sg-send-vault-test -p 8080:8080 "$IMG"
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/info/health)
          ROOT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/)
          docker stop sg-send-vault-test
          if [ "$STATUS" != "200" ];      then echo "Health check failed: $STATUS";  exit 1; fi
          if [ "$ROOT_STATUS" != "200" ]; then echo "Root check failed: $ROOT_STATUS"; exit 1; fi
          echo "Health + vault UI checks passed for $IMG"
