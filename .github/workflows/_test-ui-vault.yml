name: Vault UI Tests (reusable)

# Reusable workflow — invoked by deploy-ui-vault.yml as a test gate before deploy.
# Defines the unit → integration → E2E pipeline once so the gate cannot drift.

on:
  workflow_call:

jobs:
  # ── Unit tests (~5s): pure JS, Node + jsdom, zero network ─────────────────
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:vault-unit

  # ── Integration tests (~10s): Node + jsdom + in-memory SGVault stub ───────
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:vault-integration

  # ── E2E tests (~60s): Playwright + local file server ──────────────────────
  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 2          # healthy run is ~1 min; fail fast if the Playwright install hangs
    needs: [unit, integration]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        timeout-minutes: 1      # the step that occasionally hangs — bound it explicitly
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:vault-e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── Browser integration tests (~15s): Python pytest, FastAPI test-server + ─
  # Python http.server + Playwright Chromium + sgit-ai. End-to-end coverage of
  # live-vault scenarios (deep-link routing, CSS/JS resource loading, etc.) —
  # the layer that was missing per the user audit. Runs the same pytest cases
  # that pass locally in ~12s.
  browser-integration:
    name: Browser integration (Python + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 5            # healthy run ~15-30s including setup
    needs: [unit, integration]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pipx install poetry

      - name: Install project (pyproject.toml deps)
        run: poetry install --no-interaction --no-ansi

      - name: Install Playwright + Chromium
        run: |
          poetry run pip install playwright
          poetry run playwright install --with-deps chromium

      - name: Install sgit-ai CLI (used by the live-vault tests)
        run: poetry run pip install sgit-ai

      - name: Run browser integration tests
        run: poetry run pytest tests/integration/vault_ui/browser/ -v --tb=short
