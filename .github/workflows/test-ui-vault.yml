name: Vault UI Tests

# Standalone CI signal — runs the reusable test workflow on push / PR / manual.
# The same reusable workflow is also called by deploy-ui-vault.yml so the deploy
# is gated on the same set of checks.

on:
  push:
    paths:
      - 'sgraph_ai_app_send__ui__vault/**'
      - 'tests/unit/vault_ui/**'
      - 'tests/integration/vault_ui/**'
      - 'tests/e2e/vault_ui/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/test-ui-vault.yml'
      - '.github/workflows/_test-ui-vault.yml'
  pull_request:
    paths:
      - 'sgraph_ai_app_send__ui__vault/**'
      - 'tests/unit/vault_ui/**'
      - 'tests/integration/vault_ui/**'
      - 'tests/e2e/vault_ui/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/test-ui-vault.yml'
      - '.github/workflows/_test-ui-vault.yml'
  # Allow manual trigger from GitHub Actions UI.
  workflow_dispatch:

# Cancel any in-progress run for the same ref when a newer push arrives.
concurrency:
  group: vault-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/_test-ui-vault.yml
