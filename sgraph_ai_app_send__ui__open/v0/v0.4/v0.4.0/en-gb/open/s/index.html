<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SG/Send — Secret</title>
    <meta name="description" content="Zero-knowledge encrypted secret sharing. Your secret is decrypted in your browser — the server never sees it.">

    <!-- No-cache: each load should be fresh (secret may be consumed) -->
    <meta http-equiv="Cache-Control" content="no-store">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="../../_common/favicon.svg">

    <!-- Fonts -->
    <link rel="stylesheet" href="../../_common/fonts/fonts.css">

    <!-- Design tokens -->
    <link rel="stylesheet" href="../../_common/css/design-tokens.css">

    <!-- Secret view styles -->
    <link rel="stylesheet" href="../../_common/js/components/send-secret-view/send-secret-view.css">
</head>
<body>

    <header class="secret-page-header">
        <span class="secret-page-logo">SG/Send 🔒</span>
        <a href="https://sgraph.ai" class="secret-page-home">sgraph.ai</a>
    </header>

    <main>
        <send-secret-view></send-secret-view>
    </main>

    <!-- ═══════════════════════════════════════════════════════════════════════
         v0.4.0 open — secret receive page (/open/s/).

         Path format:    /en-gb/open/s/{transferId}#{keyHex}          → view secret
         Kill path:      /en-gb/open/s/kill/{transferId}#{deleteAuth}  → kill confirm

         The #fragment is NEVER sent in HTTP requests — zero-knowledge guarantee.

         Path note: ../../_common/ (three levels up to tree root).

         Phase B: api-client-v032.js extension is inlined into api-client.js.
         downloadBase64() and deleteTransfer() are now native methods on ApiClient.
         ═══════════════════════════════════════════════════════════════════════ -->

    <!-- Build info -->
    <script src="../../_common/js/build-info.js"></script>
    <script>
        if (!window.SGRAPH_BUILD) {
            window.SGRAPH_BUILD = { appVersion: 'dev', uiVersion: 'v0.4.0' };
        }
    </script>

    <!-- Crypto + API utilities -->
    <script src="../../_common/js/crypto.js"></script>
    <script src="../../_common/js/api-client.js"></script>

    <!-- Base system -->
    <script src="../../_common/js/base/send-helpers.js"></script>
    <script src="../../_common/js/base/send-component-paths.js"></script>
    <script>
        SendComponentPaths.init('../../_common');
    </script>
    <script src="../../_common/js/base/send-component.js"></script>

    <!-- Secret receive component -->
    <script src="../../_common/js/components/send-secret-view/send-secret-view.js"></script>

    <script>
        document.body.setAttribute('data-ready', 'true');
    </script>

</body>
</html>
