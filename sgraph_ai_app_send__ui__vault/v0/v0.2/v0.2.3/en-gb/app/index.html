    <!-- Debug infrastructure: fetch proxy + event buffer. Must run first. -->
    <script>
    (function () {
        'use strict';
        // Global debug event buffer — components read history on connect.
        window._appDebug = { vaultEvents: [], bridgeCalls: [], networkCalls: [], maxItems: 300 };
        function _bufPush(arr, item) { arr.push(item); if (arr.length > 300) arr.shift(); }
        document.addEventListener('app-debug:vault-event',   function (e) { _bufPush(window._appDebug.vaultEvents,  e.detail); });
        document.addEventListener('app-debug:bridge-call',   function (e) { _bufPush(window._appDebug.bridgeCalls,  e.detail); });
        document.addEventListener('app-debug:network-call',  function (e) { _bufPush(window._appDebug.networkCalls, e.detail); });

        // Fetch proxy — records all outbound fetch() calls
        var _origFetch = window.fetch;
        window.fetch = function (input, init) {
            var url    = typeof input === 'string' ? input : (input && input.url) || String(input);
            var method = ((init && init.method) || 'GET').toUpperCase();
            var t0     = performance.now();
            return _origFetch.apply(this, arguments).then(function (resp) {
                document.dispatchEvent(new CustomEvent('app-debug:network-call', {
                    detail: { method: method, url: _maskUrl(url), status: resp.status, ms: Math.round(performance.now() - t0), ok: resp.ok }
                }));
                return resp;
            }, function (err) {
                document.dispatchEvent(new CustomEvent('app-debug:network-call', {
                    detail: { method: method, url: _maskUrl(url), status: 0, ms: Math.round(performance.now() - t0), ok: false, err: err.message }
                }));
                throw err;
            });
        };
        function _maskUrl(url) {
            return url.replace(/#.*$/, '#…').replace(/\/obj-[a-f0-9]{20,}/g, '/obj-***');
        }
    }());
    </script>

    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body {
            height: 100%; margin: 0; padding: 0;
            background: #0a0a18; color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }
        body { display: flex; flex-direction: column; }
        /* HUD-host height auto-sizes — the chrome row is always 48px but the nav row
           adds ~32px when 'navBar' is enabled in app.json, and goes to 0px in hidden mode.
           overflow MUST be visible so the ⋯ recent-pages menu (position:absolute, anchored
           to the ⋯ button, dropping down below the HUD) can render into the iframe area
           below. z-index puts the HUD's stacking context above #layout-host (the iframe)
           so the dropdown actually paints on top rather than being covered. */
        #hud-host  { flex: 0 0 auto; position: relative; z-index: 10; }
        #layout-host { flex: 1; min-height: 0; position: relative; }
        sg-layout { display: block; width: 100%; height: 100%; }
        app-hud { display: block; width: 100%; }
        /* Hide the sg-layout stack chrome on the app page — panels need no title bar */
        #app-layout { --sgl-panel-header-height: 0px; }
        /* #llm-host is normally an invisible parking bay (the panels live in the layout).
           It only becomes visible on the no-layout fallback path, where it has to be a
           usable column rather than an unstyled block dumped under the app. */
        #llm-host[hidden] { display: none; }
        #llm-host {
            position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 92vw);
            z-index: 20; display: flex; flex-direction: column;
            border-left: 1px solid #24304a; background: #0d1120;
        }
        #llm-host > * { flex: 1; min-height: 0; }
        #llm-host > *[hidden] { display: none; }
    </style>

<body>
    <div id="hud-host"><app-hud id="app-hud"></app-hud></div>
    <div id="layout-host"><sg-layout id="app-layout"></sg-layout></div>

    <!-- The AI panels live here until they are mounted into #app-layout, and come back
         here when closed. They must be REAL light-DOM elements that survive being
         un-panelled: the chat carries the transcript, the attached files and the cost
         pills, so closing the panel must move it out of sight, never destroy it. -->
    <div id="llm-host" hidden>
        <vault-llm-chat></vault-llm-chat>
        <vault-llm-requests hidden></vault-llm-requests>
    </div>

    <script>
    (function () {
        'use strict';

        // Layout config — kept in scope so debug toggle can update sizes.
        var _layoutCfg = {
            type: 'row',
            sizes: [1.0, 0.0],
            children: [
                { type: 'stack', id: 'app-area',   tabs: [{ tag: 'app-shell',      title: 'App',      locked: true  }] },
                { type: 'stack', id: 'debug-area', tabs: [{ tag: 'app-debug-pane', title: '🔍 Debug', locked: false }] }
            ]
        };

        // Restore debug pane state from sessionStorage
        try {
            if (sessionStorage.getItem('app-debug-open') === '1') {
                var savedSplit = parseFloat(sessionStorage.getItem('app-debug-split') || '0.28');
                _layoutCfg.sizes = [1 - savedSplit, savedSplit];
            }
        } catch (_) {}

        Promise.all([
            customElements.whenDefined('sg-layout'),
            customElements.whenDefined('app-shell'),
            customElements.whenDefined('app-debug-pane')
        ]).then(function () {
            var layout = document.getElementById('app-layout');
            layout.setLayout(_layoutCfg);
        });

        // app-shell → app-hud: wire vault info to HUD once shell is ready
        document.addEventListener('app-shell:ready', function (e) {
            var hud = document.getElementById('app-hud');
            if (hud && typeof hud.setInfo === 'function') {
                hud.setInfo(e.detail.vaultName, e.detail.appTitle, e.detail.vaultKey, e.detail.isRO);
            }
            if (hud && typeof hud.setPrivileges === 'function') {
                hud.setPrivileges(e.detail.perm);
            }
            // Release picker + "not the latest version" pill. No-op unless the vault
            // publishes .vault/releases.json.
            var shellEl = document.querySelector('app-shell');
            if (hud && typeof hud.setReleases === 'function' && shellEl) {
                hud.setReleases(shellEl._releases || null, shellEl._release || null);
            }
            // Apply the app.json hud.* config (mode + show.* flags). Idempotent — safe to
            // call before setInfo. The user-side force-show-hud override is read here so
            // power users can keep chrome visible even on 'hidden'-mode apps.
            if (hud && typeof hud.applyHudConfig === 'function') {
                var cfg = e.detail.hudCfg;
                try {
                    var force = localStorage.getItem('sg-app-force-show-hud') === '1';
                    // Force-show upgrades BOTH chrome-less modes (hidden + none) to full, so a
                    // power user is never trapped in a vault app with no visible way back.
                    if (force && cfg && (cfg.mode === 'hidden' || cfg.mode === 'none')) {
                        cfg = Object.assign({}, cfg, { mode: 'full' });
                    }
                } catch (_) {}
                hud.applyHudConfig(cfg);
            }
        });

        // ── AI Chat as host chrome ────────────────────────────────────────────────
        // Same panels as /vault, same mount/park bookkeeping (LlmPanels), mounted into
        // THIS page's layout. They run at the real origin, so the chat holds the vault
        // key and the microphone directly — the sandboxed app frame is not involved and
        // never sees either. An app does not have to ask for anything, or know this
        // exists, for the user to get it.
        var _llm = LlmPanels.create({
            host     : document.getElementById('llm-host'),
            sidebar  : function () { return document.getElementById('llm-host'); },
            getLayout: function () {
                return customElements.whenDefined('sg-layout').then(function () {
                    var l = document.getElementById('app-layout');
                    return (l && typeof l.addPanel === 'function') ? l : null;
                });
            }
        });

        function _openLlm(kind, title) {
            return Promise.resolve(_llm.show(kind, title)).then(function (el) {
                // The chat needs the vault to resolve .vault/llm; app-shell hands it over
                // on ready. Re-set on every open so a re-keyed or switched vault is picked
                // up rather than the panel talking to a stale one.
                if (el && _vault && typeof el.setVault === 'function') el.setVault(_vault);
                if (el && typeof el.open === 'function') el.open();
                return el;
            });
        }

        var _vault = null;
        document.addEventListener('app-shell:ready', function (e) {
            _vault = (e.detail && e.detail.vault) || null;
            var chat = _llm.el('chat');
            if (chat && _vault && typeof chat.setVault === 'function') chat.setVault(_vault);
        });

        document.addEventListener('app-hud:llm',            function () { _openLlm('chat', '\u2728 AI Chat'); });
        document.addEventListener('vault-llm-open',         function () { _openLlm('chat', '\u2728 AI Chat'); });
        document.addEventListener('vault-llm-close',        function () { _llm.close('chat'); });
        document.addEventListener('vault-llm-requests-open',  function () { _openLlm('requests', 'AI Requests'); });
        document.addEventListener('vault-llm-requests-close', function () { _llm.close('requests'); });

        // Debug pane expand/collapse
        document.addEventListener('app-debug:toggle', function (e) {
            var layout = document.getElementById('app-layout');
            if (!layout || typeof layout.setLayout !== 'function') return;
            var open  = !!e.detail.open;
            var split = e.detail.split || 0.28;
            _layoutCfg = Object.assign({}, _layoutCfg, {
                sizes: open ? [1 - split, split] : [1.0, 0.0]
            });
            // setLayout() rebuilds the tree from _layoutCfg and unmounts everything not in
            // it — which includes any AI panel added with addPanel(). Park them first or
            // the transcript is destroyed by toggling the debug pane, then put back the
            // ones that were open.
            var reopen = _llm.detachAll();
            layout.setLayout(_layoutCfg);
            reopen.forEach(function (kind) {
                _openLlm(kind, kind === 'requests' ? 'AI Requests' : '\u2728 AI Chat');
            });
            try {
                sessionStorage.setItem('app-debug-open',  open ? '1' : '0');
                sessionStorage.setItem('app-debug-split', String(split));
            } catch (_) {}
        });
    }());
    </script>
</body>
