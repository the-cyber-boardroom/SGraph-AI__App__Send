<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SG/Vault — Markdown Harness</title>
    <meta name="robots" content="noindex">

    <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
        --bg:        #0d1117;
        --bg2:       #111820;
        --bg3:       #161d27;
        --border:    rgba(255,255,255,0.08);
        --text:      #e0e6f0;
        --muted:     #6e7a8a;
        --teal:      #4ecdc4;
        --teal-dim:  rgba(78,205,196,0.12);
        --warn:      #e0ac4e;
        --warn-dim:  rgba(224,172,78,0.10);
        --err:       #e06c75;
        --pass:      #4ecdc4;
        --pass-dim:  rgba(78,205,196,0.08);
        --fail:      #e06c75;
        --fail-dim:  rgba(224,108,117,0.10);
    }

    html, body { height: 100%; background: var(--bg); color: var(--text);
        font-family: system-ui, -apple-system, sans-serif; font-size: 15px;
        line-height: 1.5; overflow: hidden; }

    /* ── Header ─────────────────────────────────────────────────────────── */
    .mh-header {
        display: flex; align-items: baseline; gap: 0.75rem;
        padding: 0.4rem 1rem;
        border-bottom: 1px solid var(--border);
        background: var(--bg2);
        flex-shrink: 0; height: 38px;
    }
    .mh-header__title { font-size: 0.9rem; font-weight: 700; color: #fff; }
    .mh-header__badge {
        font-size: 0.6rem; font-weight: 600; text-transform: uppercase;
        letter-spacing: 0.08em; color: var(--warn); background: var(--warn-dim);
        border: 1px solid rgba(224,172,78,0.25); border-radius: 4px;
        padding: 0.1rem 0.4rem;
    }
    .mh-header__sub {
        font-size: 0.78rem; color: var(--muted);
    }
    .mh-header__nav { margin-left: auto; display: flex; gap: 0.75rem; align-items: center; }
    .mh-header__nav a { color: var(--muted); font-size: 0.78rem; text-decoration: none; }
    .mh-header__nav a:hover { color: var(--teal); }

    /* ── Body layout: left tests, right playground ──────────────────────── */
    .mh-body {
        height: calc(100vh - 38px);
        display: flex;
        overflow: hidden;
    }

    /* ── Left panel: test runner ────────────────────────────────────────── */
    .mh-tests {
        width: 360px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border);
        overflow: hidden;
    }
    .mh-tests__toolbar {
        display: flex; align-items: center; gap: 0.5rem;
        padding: 0.5rem 0.75rem;
        border-bottom: 1px solid var(--border);
        background: var(--bg2); flex-shrink: 0;
    }
    .mh-tests__toolbar h2 { font-size: 0.78rem; font-weight: 700; text-transform: uppercase;
        letter-spacing: 0.06em; color: var(--muted); flex: 1; }
    .mh-btn {
        padding: 0.25rem 0.7rem; font-size: 0.75rem; font-weight: 600;
        background: var(--bg3); color: var(--teal);
        border: 1px solid rgba(78,205,196,0.25); border-radius: 4px;
        cursor: pointer; font-family: inherit;
    }
    .mh-btn:hover { background: var(--teal-dim); }
    .mh-tests__results { flex: 1; overflow-y: auto; padding: 0.5rem; }

    /* ── Test result rows ───────────────────────────────────────────────── */
    .mh-summary {
        padding: 0.5rem 0.75rem; border-radius: 4px;
        font-size: 0.8rem; font-weight: 600; margin-bottom: 0.5rem;
    }
    .mh-summary--pass { background: var(--pass-dim); color: var(--pass);
        border: 1px solid rgba(78,205,196,0.2); }
    .mh-summary--fail { background: var(--fail-dim); color: var(--fail);
        border: 1px solid rgba(224,108,117,0.2); }

    .mh-test {
        padding: 0.35rem 0.5rem; border-radius: 4px;
        font-size: 0.78rem; display: flex; align-items: flex-start; gap: 0.5rem;
        margin-bottom: 2px; flex-wrap: wrap;
    }
    .mh-test--pass { color: var(--text); }
    .mh-test--fail { background: var(--fail-dim); color: var(--fail);
        border: 1px solid rgba(224,108,117,0.15); }
    .mh-icon { flex-shrink: 0; font-size: 0.75rem; margin-top: 0.05rem; }
    .mh-test--pass .mh-icon { color: var(--pass); }
    .mh-test--fail .mh-icon { color: var(--fail); }
    .mh-name { flex: 1; min-width: 0; }
    .mh-detail {
        width: 100%; background: var(--bg); padding: 0.5rem;
        border-radius: 3px; font-size: 0.72rem; color: var(--err);
        font-family: monospace; white-space: pre-wrap; word-break: break-all;
        margin-top: 0.25rem;
    }

    /* ── Right panel: playground ────────────────────────────────────────── */
    .mh-playground {
        flex: 1; display: flex; flex-direction: column; overflow: hidden;
    }
    .mh-playground__toolbar {
        display: flex; align-items: center; gap: 0.5rem;
        padding: 0.5rem 0.75rem;
        border-bottom: 1px solid var(--border);
        background: var(--bg2); flex-shrink: 0;
    }
    .mh-playground__toolbar h2 { font-size: 0.78rem; font-weight: 700; text-transform: uppercase;
        letter-spacing: 0.06em; color: var(--muted); flex: 1; }
    .mh-split {
        flex: 1; display: flex; overflow: hidden;
    }

    /* Input pane */
    .mh-input {
        width: 40%; flex-shrink: 0;
        display: flex; flex-direction: column;
        border-right: 1px solid var(--border);
    }
    .mh-input__label {
        padding: 0.3rem 0.75rem; font-size: 0.7rem; text-transform: uppercase;
        letter-spacing: 0.06em; color: var(--muted);
        border-bottom: 1px solid var(--border); background: var(--bg2); flex-shrink: 0;
    }
    .mh-input textarea {
        flex: 1; width: 100%; padding: 0.75rem;
        background: var(--bg3); color: var(--text);
        border: none; outline: none; resize: none;
        font-family: monospace; font-size: 0.8rem; line-height: 1.6;
        tab-size: 2;
    }

    /* Output pane */
    .mh-output {
        flex: 1; display: flex; flex-direction: column; overflow: hidden;
    }
    .mh-output__label {
        padding: 0.3rem 0.75rem; font-size: 0.7rem; text-transform: uppercase;
        letter-spacing: 0.06em; color: var(--muted);
        border-bottom: 1px solid var(--border); background: var(--bg2); flex-shrink: 0;
        display: flex; align-items: center; gap: 0.5rem;
    }
    .mh-output__label span { flex: 1; }
    #md-output {
        flex: 1; overflow-y: auto; padding: 1.25rem 1.5rem;
        background: #fff; color: #111;
        font-family: 'Georgia', serif;
    }

    /* Rendered markdown styles inside the output pane */
    #md-output .sb-file__markdown { max-width: 100%; }
    #md-output h1,#md-output h2,#md-output h3,
    #md-output h4,#md-output h5,#md-output h6 {
        margin: 1.2em 0 0.4em; font-family: system-ui, sans-serif; }
    #md-output h1 { font-size: 1.8em; border-bottom: 1px solid #ddd; padding-bottom: 0.2em; }
    #md-output h2 { font-size: 1.4em; border-bottom: 1px solid #eee; padding-bottom: 0.15em; }
    #md-output p  { margin: 0.75em 0; line-height: 1.7; }
    #md-output ul,#md-output ol { margin: 0.75em 0; padding-left: 1.5em; }
    #md-output li { margin: 0.25em 0; line-height: 1.6; }
    #md-output code { background: #f3f3f3; border-radius: 3px;
        padding: 0.1em 0.35em; font-size: 0.88em; font-family: monospace; }
    #md-output pre { background: #f6f8fa; border-radius: 6px;
        padding: 1em; overflow-x: auto; margin: 0.75em 0; }
    #md-output pre code { background: none; padding: 0; font-size: 0.85em; }
    #md-output blockquote { border-left: 4px solid #4ecdc4; margin: 1em 0;
        padding: 0.5em 1em; background: #f0faf9; color: #333; }
    #md-output table { border-collapse: collapse; width: 100%; margin: 0.75em 0; }
    #md-output th,#md-output td { border: 1px solid #ddd; padding: 0.5em 0.75em; }
    #md-output th { background: #f6f8fa; font-family: system-ui, sans-serif; }
    #md-output hr { border: none; border-top: 2px solid #eee; margin: 1.5em 0; }
    #md-output a  { color: #0969da; }
    #md-output img { max-width: 100%; border-radius: 6px; }
    #md-output .sb-file__md-source {
        padding: 1rem; font-size: 0.8rem; line-height: 1.6;
        white-space: pre-wrap; word-break: break-all; color: #111;
        font-family: monospace; background: #f6f8fa;
    }
    </style>
</head>
<body>

    <header class="mh-header">
        <span class="mh-header__title">SG/Vault — Markdown Harness</span>
        <span class="mh-header__badge">dev only</span>
        <span class="mh-header__sub">Refactored lib/markdown — NOT wired to main vault yet</span>
        <nav class="mh-header__nav">
            <a href="/en-gb/vault">← Vault</a>
            <a href="/en-gb/vault/peek">Peek</a>
            <a href="/en-gb/vault/token">Token</a>
            <a href="/en-gb/vault/sgit">SGit</a>
        </nav>
    </header>

    <div class="mh-body">

        <!-- Left: test runner -->
        <div class="mh-tests">
            <div class="mh-tests__toolbar">
                <h2>Unit tests</h2>
                <button class="mh-btn" id="run-btn">▶ Run all</button>
            </div>
            <div class="mh-tests__results" id="test-results">
                <div style="padding:0.5rem;font-size:0.8rem;color:var(--muted)">
                    Click <strong>▶ Run all</strong> to execute the test suite.
                </div>
            </div>
        </div>

        <!-- Right: live playground -->
        <div class="mh-playground">
            <div class="mh-playground__toolbar">
                <h2>Live playground — new MarkdownRenderer</h2>
                <button class="mh-btn" id="source-btn">Source</button>
                <button class="mh-btn" id="refresh-btn">↺ Refresh</button>
            </div>
            <div class="mh-split">
                <div class="mh-input">
                    <div class="mh-input__label">Markdown source</div>
                    <textarea id="md-input" spellcheck="false" autocomplete="off"></textarea>
                </div>
                <div class="mh-output">
                    <div class="mh-output__label">
                        <span>Rendered output (new lib/markdown)</span>
                    </div>
                    <div id="md-output"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- New standalone lib — NOT yet wired to send-browse or vault-browse-edit -->
    <script src="../../../_common/lib/markdown/markdown-parser.js"></script>
    <script src="../../../_common/lib/markdown/markdown-renderer.js"></script>
    <script src="md-harness.js"></script>

    <script>
    (function () {
        // Wire test runner
        document.getElementById('run-btn').addEventListener('click', function () {
            var container = document.getElementById('test-results');
            container.innerHTML = '';
            var suite = runTests();
            renderResults(container, suite);
        });

        // Auto-run on load
        var suite = runTests();
        renderResults(document.getElementById('test-results'), suite);

        // Wire playground
        initPlayground(
            document.getElementById('md-input'),
            document.getElementById('md-output'),
            document.getElementById('source-btn'),
            document.getElementById('refresh-btn')
        );
    }());
    </script>

</body>
</html>
