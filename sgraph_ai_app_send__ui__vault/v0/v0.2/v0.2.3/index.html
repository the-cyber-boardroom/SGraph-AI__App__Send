    <!-- Routing: root is the only hash inbox; all other paths strip and discard.
         With #token → save to LS → /en-gb/app#token (app-shell opens vault; redirects to
         /en-gb/vault/ if no app.json found).
         Without # → /en-gb/ (landing, user picks from list).
         Anywhere else → strip hash, render page. -->
    <script>
    (function () {
        var path   = window.location.pathname.replace(/\/$/, '');
        var isRoot = (path === '' || path === '/index.html');
        if (isRoot) {
            VaultLoaderRouting.runRoot();
        } else {
            VaultLoaderRouting.runVault();
        }
    }());
    </script>

    <!-- 4c. Vault deep-link patch: use | separator (vault URL format) -->
    <script>
    (function() {
        // Global state for deep-link copy button (populated by _mountBrowse patch below)
        window._vaultDeepLinkPath  = null;
        window._vaultCurrentToken  = null;
        window._vaultBrowseElement = null;

        // Read deep-link path from hash (e.g. #token|path/to/file.md → "path/to/file.md")
        if (typeof _plrGetHashPath === 'function') {
            _plrGetHashPath = function() {
                var hash = window.location.hash.slice(1);
                var idx  = hash.indexOf('|');
                if (idx === -1) return null;
                return hash.slice(idx + 1) || null;
            };
        }
        // Do NOT write file paths back to the URL bar — the address bar stays clean.
        // Instead, update the browse component's downloadUrl so the Share tab "Copy Link"
        // button returns the correct file-specific deep link.
        if (typeof _plrSetHashPath === 'function') {
            _plrSetHashPath = function(path) {
                window._vaultDeepLinkPath = path || null;
                var browse = window._vaultBrowseElement;
                var token  = window._vaultCurrentToken;
                if (browse && token) {
                    // Share URLs use root /#token — the only place a hash is allowed.
                    var base = window.location.origin + '/#' + token;
                    browse.downloadUrl = path ? (base + '|' + path) : base;
                }
            };
        }
    })();
    </script>

    <!-- 11b. Loading screen controller
         Updates the #sg-vault-loading progress bar through the vault open lifecycle.
         Steps: UI loaded → checking key → opening → loading structure → done. -->
    <script>
    (function () {
        'use strict';

        var bar   = document.getElementById('sg-vl-bar');
        var step  = document.getElementById('sg-vl-step');
        var title = document.getElementById('sg-vl-title');
        var panel = document.getElementById('sg-vault-loading');
        if (!panel) return;

        function _set(pct, stepText, titleText) {
            if (bar)   bar.style.width  = pct + '%';
            if (step)  step.textContent = stepText;
            if (title && titleText) title.textContent = titleText;
        }

        function _hide() {
            if (!panel) return;
            panel.classList.add('sg-vl--hidden');
            setTimeout(function() { if (panel) panel.remove(); }, 400);
        }

        // Step 1: UI scripts loaded (we're running now)
        // Check if we're opening in App Mode from URL — show appropriate title.
        var isAppMode = false;
        try {
            var dl = sessionStorage.getItem('sg-vault-deep-link') || '';
            isAppMode = dl.startsWith('app:');
        } catch (_) {}
        _set(20, 'Checking vault key…', isAppMode ? 'Loading Vault App' : 'Loading Vault');

        // If no vault key in localStorage, we'll show the entry form — hide loading
        // after a short delay so the vault-entry component can render.
        var hasKey = false;
        try { hasKey = !!(VaultLoader && VaultLoader.storage && VaultLoader.storage.getCurrentKey()); } catch (_) {}
        if (!hasKey) {
            setTimeout(function() { _hide(); }, 300);
            return;
        }

        // Step 2: vault open in progress
        _set(35, 'Opening vault…');

        var events = window.sgraphVault && window.sgraphVault.events;
        if (!events) { setTimeout(_hide, 4000); return; }

        events.on('vault-opened', function() {
            _set(70, 'Loading vault structure…');
        });

        // Step 3: shell signals it finished mounting browse — hide loading screen.
        // We hook onto 'vault-browse-mounted' (fired by the _mountBrowse patch below).
        events.on('vault-browse-mounted', function() {
            _set(100, 'Ready');
            setTimeout(_hide, 250);
        });

        // Fallback: if vault-browse-mounted never fires (e.g. error), hide after 12s.
        setTimeout(function() { _hide(); }, 12000);
    }());
    </script>

    <!-- 12. v0.2.1 patch: create vault from simple token + vault-not-found error page -->
    <script>
    (function () {
        'use strict';

        // Extend SGVault with createFromToken — same key derivation as open(),
        // so the vault can always be re-opened with just the simple token.
        SGVault.createFromToken = async function (sgSend, token, options) {
            options = options || {};
            var keys = await SGVaultCrypto.deriveKeysFromSimpleToken(token);
            var vault = new SGVault(sgSend);
            vault._passphrase        = token;
            vault._vaultId           = keys.vaultId;
            vault._readKey           = keys.readKey;
            vault._writeKey          = keys.writeKey;
            vault._hmacKey           = keys.hmacKey;
            vault._refFileId         = keys.refFileId;
            vault._branchIndexFileId = keys.branchIndexFileId;
            vault._cloneRefFileId    = await SGVaultCrypto.deriveBranchRefFileId(
                keys.hmacKey, keys.vaultId, 'web-ui'
            );
            vault._initManagers();
            vault._settings = {
                vault_name:  options.name || token,
                vault_id:    keys.vaultId,
                created:     new Date().toISOString(),
                version:     3,
                description: options.description || ''
            };
            vault._tree = { '/': { type: 'folder', children: {} } };

            // Initial commit (empty tree + settings)
            await vault._commit('Initial vault creation');

            // Add README.md — gives sgit clone immediate content and orients new users
            var readmeDate  = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
            var readmeBytes = new TextEncoder().encode(
                '# New Vault\n\n' +
                'Created at vault.sgraph.ai on ' + readmeDate + '.\n\n' +
                'Zero-knowledge encrypted — files are encrypted in your browser. The server never sees a key.\n\n' +
                '## Working with sgit\n\n' +
                '    sgit clone ' + token + '\n' +
                '    sgit push\n' +
                '    sgit pull\n'
            );
            await vault.addFile('/', 'README.md', readmeBytes);

            // Write the named ref (published branch HEAD) to the post-README commit.
            // _headCommitId is set by _commit() / addFile(); _namedHeadId is set here.
            // (Mirrors what SGVault.create() does — must NOT use _namedHeadId before this line.)
            await vault._refManager.writeRef(vault._refFileId, vault._headCommitId);
            vault._namedHeadId = vault._headCommitId;

            // Write the branch index — required for `sgit clone` to discover refs.
            // Without this, sgit has no way to find head_ref_id for the named branch
            // (the web client gets away without it because it caches ref IDs in memory,
            // but sgit starts from scratch on every clone).
            //
            // Derive deterministic branch IDs from the HMAC key (same approach as ref IDs).
            var _hmac = function (hmacKey, domain) {
                return crypto.subtle.sign('HMAC', hmacKey, new TextEncoder().encode(domain))
                    .then(function (buf) {
                        return Array.from(new Uint8Array(buf))
                            .map(function (b) { return b.toString(16).padStart(2, '0'); })
                            .join('').slice(0, 12);
                    });
            };
            var namedHex = await _hmac(vault._hmacKey, 'sg-vault-v1:file-id:branch-id:named:' + vault._vaultId);
            var cloneHex = await _hmac(vault._hmacKey, 'sg-vault-v1:file-id:branch-id:clone:web-ui:' + vault._vaultId);

            // created_at must be epoch milliseconds integer — sgit's Safe_UInt__Timestamp
            // rejects ISO strings and epoch-seconds (too small for its range check).
            var createdAtInt = new Date(vault._settings.created).getTime();
            var branchIndex = {
                schema:   'branch_index_v1',
                branches: [
                    {
                        branch_id:   'branch-named-' + namedHex,
                        branch_type: 'named',
                        head_ref_id: vault._refFileId,
                        name:        'current',
                        created_at:  createdAtInt
                    },
                    {
                        branch_id:   'branch-clone-' + cloneHex,
                        branch_type: 'clone',
                        head_ref_id: vault._cloneRefFileId,
                        name:        'web-ui',
                        created_at:  createdAtInt
                    }
                ]
            };
            var indexPayload   = new TextEncoder().encode(JSON.stringify(branchIndex));
            var indexEncrypted = await SGSendCrypto.encrypt(indexPayload, vault._readKey);
            await vault._sgSend.vaultWrite(
                vault._vaultId,
                'bare/indexes/' + vault._branchIndexFileId,
                vault._writeKey,
                new Uint8Array(indexEncrypted)
            );
            vault._branchIndex = branchIndex;

            return vault;
        };

        // .vault-settings.json is internal vault metadata. We deliberately DO NOT list it in
        // the editor's file tree (it appeared as an "auto-added orphan" otherwise). The synthetic
        // read/write hooks are kept so any consumer that asks for the path directly (e.g. the
        // Settings tab round-tripping JSON) still works — but getTree/getFileList no longer
        // surface it. The kernel also only re-writes .vault-settings.json when settings actually
        // change (initial commit, or _settingsDirty after setName/setSettings) — see sg-vault.js.
        (function () {
            var proto = window.VaultDataSource && window.VaultDataSource.prototype;
            if (!proto) return;
            var VSFILE = '.vault-settings.json';

            var _origGetFileBytes = proto.getFileBytes;
            proto.getFileBytes = async function (path) {
                if (path === VSFILE) {
                    var json = JSON.stringify(this._vault._settings || {}, null, 2);
                    return new TextEncoder().encode(json).buffer;
                }
                return _origGetFileBytes.call(this, path);
            };

            var _origSaveFile = proto.saveFile;
            proto.saveFile = async function (folderPath, fileName, bytes) {
                if (fileName === VSFILE) {
                    if (!this.writable) throw new Error('Read-only: no access key');
                    var buf  = bytes instanceof ArrayBuffer ? bytes : new Uint8Array(bytes).buffer;
                    var text = new TextDecoder().decode(buf);
                    this._vault._settings = JSON.parse(text);
                    this._vault._settingsDirty = true;       // ensure next commit writes it
                    await this._vault._commit('Update .vault-settings');
                    if (this.onTreeChanged) this.onTreeChanged();
                    return;
                }
                return _origSaveFile.call(this, folderPath, fileName, bytes);
            };
        }());

        // Hide .vs-entry immediately when a vault token is loaded (from localStorage).
        // The top-level routing script saves any incoming hash token to
        // localStorage('sg-vault-key') before this runs.
        (function () {
            var token = '';
            try { token = (sessionStorage.getItem('sg-vault-key') || localStorage.getItem('sg-vault-key') || '').toLowerCase(); } catch (_) {}
            if (!token) return;
            var shell    = document.querySelector('vault-shell');
            var entryDiv = shell && shell.querySelector('.vs-entry');
            if (entryDiv) entryDiv.style.display = 'none';
        }());

        // Show a "Creating your vault…" splash immediately when the landing page redirected
        // here with sg-vault-creating set. The splash fills the blank screen while the async
        // crypto key derivation and initial commit network call complete.
        (function () {
            var token = '';
            try { token = (sessionStorage.getItem('sg-vault-key') || localStorage.getItem('sg-vault-key') || '').toLowerCase(); } catch (_) {}
            if (!token) return;
            // Null-origin sandbox safe: wrap so the splash IIFE doesn't crash the page
            // when this vault loads inside a parent vault's null-origin iframe (embed mode).
            var creating = null;
            try { creating = sessionStorage.getItem('sg-vault-creating'); } catch (_) {}
            if (!creating || creating !== token) return;

            var splash = document.createElement('div');
            splash.id  = 'sg-creating-splash';
            splash.setAttribute('style',
                'position:fixed;inset:0;z-index:9999;background:#0d1117;' +
                'display:flex;align-items:center;justify-content:center;' +
                'flex-direction:column;gap:1.25rem;font-family:system-ui,sans-serif;' +
                'text-align:center;padding:2rem');
            splash.innerHTML =
                '<div style="font-size:3rem">🔐</div>' +
                '<div style="color:#4ecdc4;font-size:1.2rem;font-weight:700">Creating your vault…</div>' +
                '<div style="color:#6e7a8a;font-size:0.85rem;max-width:360px;line-height:1.6">' +
                'Deriving encryption keys and writing the initial commit.<br>This takes a moment.' +
                '</div>';
            document.body.appendChild(splash);
        }());

        // Helper: remove the creating splash (safe to call even if it was never shown).
        function _removeSplash() {
            var el = document.getElementById('sg-creating-splash');
            if (el) el.remove();
        }

        // Helper: reveal the vault-entry form (used when create fails so the error is visible).
        function _revealEntry() {
            var shell    = document.querySelector('vault-shell');
            var entryDiv = shell && shell.querySelector('.vs-entry');
            if (entryDiv) entryDiv.style.display = '';
        }

        // Full-page error when auto-open fails — replaces the page body entirely
        function _escHtml(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function _showAutoOpenErrorPage(token, err) {
            var msg = err ? err.message : '';
            var isNotFound = msg.includes('not found') || msg.includes('404');
            var title    = isNotFound ? 'Vault not found' : 'Cannot open vault';
            var subtitle = isNotFound
                ? 'This vault does not exist on this server:'
                : 'The token may be invalid or in the wrong format:';

            var isInRecent = (function () {
                try {
                    if (typeof VaultLoaderRecent === 'undefined') return false;
                    return VaultLoaderRecent.list().some(function (e) { return e.key === token; });
                } catch (_) { return false; }
            }());

            document.body.innerHTML =
                '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;' +
                'flex-direction:column;gap:1.25rem;padding:2rem;background:#0d1117;' +
                'font-family:system-ui,sans-serif;text-align:center">' +
                '<div style="font-size:3rem">🔐</div>' +
                '<h1 style="color:#fff;font-size:1.5rem;font-weight:700;margin:0">' + _escHtml(title) + '</h1>' +
                '<p style="color:#6e7a8a;font-size:0.875rem;max-width:420px;line-height:1.6;margin:0">' + _escHtml(subtitle) + '</p>' +
                '<div style="display:flex;flex-direction:column;gap:0.3rem;align-items:center">' +
                '<div style="font-size:0.65rem;text-transform:uppercase;letter-spacing:0.08em;color:#6e7a8a">Vault token</div>' +
                '<code style="display:block;color:#4ecdc4;font-family:monospace;font-size:1.05rem;' +
                'letter-spacing:0.02em;background:rgba(78,205,196,0.06);' +
                'border:1px solid rgba(78,205,196,0.15);border-radius:6px;padding:0.5rem 1.25rem">' +
                _escHtml(token) + '</code>' +
                '</div>' +
                (isInRecent
                    ? '<button id="sg-forget-btn" style="background:transparent;border:1px solid rgba(110,122,138,0.4);' +
                      'color:#6e7a8a;border-radius:8px;padding:0.5rem 1.25rem;font-size:0.82rem;cursor:pointer;' +
                      'font-family:system-ui,sans-serif">Remove from saved vaults</button>'
                    : '') +
                '<a href="/en-gb/" style="display:inline-block;background:#4ecdc4;color:#0a1a18;' +
                'font-weight:700;text-decoration:none;border-radius:8px;padding:0.65rem 1.5rem;' +
                'font-size:0.9rem;margin-top:0.25rem">← Back to vault home</a>' +
                '</div>';

            if (isInRecent) {
                document.getElementById('sg-forget-btn').addEventListener('click', function () {
                    try { VaultLoaderRecent.remove(token); } catch (_) {}
                    window.location.assign('/en-gb/');
                });
            }
        }

        // Patch VaultEntry._onOpen for Format 3/5 key auto-open failure handling.
        // The pre-hide block hides .vs-entry when a LS key exists; if _onOpen fails
        // during auto-open, the inline error would land in the hidden form (blank screen).
        // This patch detects auto-open and shows the full-page error instead.
        (function () {
            var _origOnOpen = VaultEntry.prototype._onOpen;
            VaultEntry.prototype._onOpen = async function () {
                var vaultKey = this._keyInput.value.trim();
                if (!vaultKey) { return _origOnOpen.call(this); }

                var storedToken = (VaultLoader.storage.getCurrentKey() || '').toLowerCase();
                var isAutoOpen  = !!storedToken && storedToken === vaultKey.toLowerCase();
                if (!isAutoOpen) { return _origOnOpen.call(this); }

                // Auto-open path: show full-page error on failure
                this._hideError();
                this._showStatus('Opening vault…');
                this._openBtn.disabled = true;
                try {
                    await this._openVault(vaultKey);
                } catch (err) {
                    _showAutoOpenErrorPage(vaultKey, err);
                } finally {
                    this._openBtn.disabled = false;
                    this._hideStatus();
                }
            };
        }());

        // vault-locked: clear the session-scoped vault handle.
        // VaultLoader.lock() (called by _onLock) already removes sg-vault-key via
        // clearCurrentKey(). Only sg-vault-session (the in-tab vault handle) is left
        // to clean up here — it is not managed by VaultLoader.
        window.sgraphVault.events.on('vault-locked', function () {
            try { sessionStorage.removeItem('sg-vault-session'); } catch (_) {}
        });

        // Patch VaultShell — single IIFE for all v0.2.2 additions:
        //   1. _mountBrowse: fix downloadUrl, store browse/token refs, apply app.json, setup link handler
        //   2. _onLock: redirect to landing page (never show vault-shell entry screen)
        //   3. _applyAppJson: auto-open entry file from app.json at vault root
        //   4. _showPresentOverlay: click-through overlay to request fullscreen (requires user gesture)
        //   5. _setupVaultLinkHandler: intercept relative <a> clicks in markdown present-mode
        //
        // VaultShell is IIFE-scoped in its source file — use customElements.get() to access it.
        (function () {
            var VaultShell = customElements.get('vault-shell');
            if (!VaultShell) return;

            // ── 1. _mountBrowse ────────────────────────────────────────────────────────
            var _origMount = VaultShell.prototype._mountBrowse;
            VaultShell.prototype._mountBrowse = async function (deepLink) {
                await _origMount.call(this, deepLink);

                var browse = this.querySelector('.vs-view-files send-browse');
                var token  = this._vaultKey;

                // Fix downloadUrl: share URLs use root /#token — the only place
                // a hash is allowed. Root redirects to /en-gb/ which consumes the
                // hash into localStorage and opens the vault.
                if (browse && token) {
                    browse.downloadUrl = window.location.origin + '/#' + token;
                }
                window._vaultCurrentToken  = token  || null;
                window._vaultBrowseElement = browse || null;
                window._vaultDeepLinkPath  = null;

                // ── URL deep-link override (set by root routing or /en-gb/vault/app route) ──
                // Format:  'app:path/to/file'  → open file in App Mode (overrides app.json)
                //          'path/to/file'       → open file tab, then still run app.json
                var deepLinkOverride = typeof VaultLoaderRouting !== 'undefined' &&
                    VaultLoaderRouting.consumeDeepLink ? VaultLoaderRouting.consumeDeepLink() : '';

                // Plain file deep-link — strip any 'app:' prefix (App Mode lives on /en-gb/app only)
                var deepLinkHandled = false;
                if (deepLinkOverride && browse) {
                    var plainPath = deepLinkOverride.startsWith('app:')
                        ? deepLinkOverride.slice(4) : deepLinkOverride;
                    if (plainPath) {
                        requestAnimationFrame(function() {
                            if (browse._openFileTab) browse._openFileTab(plainPath);
                        });
                    }
                }

                // app.json auto-open (skip if URL app: override already handled it)
                if (!deepLinkHandled && this._dataSource && browse) {
                    await this._applyAppJson(this._dataSource, browse);
                }

                // Markdown present-mode link handler
                if (this._dataSource && browse) {
                    this._setupVaultLinkHandler(this._dataSource, browse);
                }

                // Signal loading screen that browse is mounted and ready.
                window.sgraphVault.events.emit('vault-browse-mounted', {});
            };

            // ── 2. _onLock ─────────────────────────────────────────────────────────────
            VaultShell.prototype._onLock = function () {
                try { sessionStorage.removeItem('sg-vault-session'); } catch (_) {}
                VaultLoader.lock();
                window.location.replace('/en-gb/');
            };

            // ── 3. _applyAppJson ───────────────────────────────────────────────────────
            // Checks for app.json (at .vault/app.json or legacy app.json at root).
            // When found: auto-opens the entry file in the vault file browser (unchanged),
            // and shows the "▶ Open [title]" button in vault-header that launches /en-gb/app.
            // sg-app-banner / chrome.mode activation is removed — the app page is the new
            // delivery mechanism. chrome.mode field is silently ignored (no-op).
            VaultShell.prototype._applyAppJson = async function (dataSource, browse) {
                var fileList = dataSource.getFileList();
                // Check .vault/app.json first (new location), fall back to app.json (legacy)
                var candidates = ['.vault/app.json', 'app.json'];
                var entry = null;
                for (var i = 0; i < candidates.length; i++) {
                    var p = candidates[i];
                    entry = fileList.find(function (f) { return f.path === p || f.path === p.replace(/^\//, ''); });
                    if (entry) break;
                }
                if (!entry) return;

                var config;
                try {
                    var buf = await dataSource.getFileBytes(entry.path);
                    config  = JSON.parse(new TextDecoder().decode(buf));
                } catch (e) {
                    console.warn('[app.json] unreadable or invalid JSON, ignoring:', e.message);
                    return;
                }

                var entryFile = config.entry    || 'index.html';
                var autoOpen  = config.auto_open !== false;
                var present   = config.present  === true ||
                                (config.chrome && config.chrome.mode === 'maximised');

                // Remember for _onAuthSubmit so entering an access key can re-activate.
                this._appJsonMode = present;

                console.log('[app.json] entry:', entryFile, '| present:', present, '| title:', config.title || '(none)');

                // Show "▶ Open [App]" button in the vault header
                var header = this.querySelector('vault-header');
                if (header && typeof header.setAppJson === 'function') {
                    header.setAppJson(config, this._vaultKey);
                }

                // Resource injection for vault HTML preview.
                // app.json may list CSS/JS in a "resources" block that are never
                // referenced by <link>/<script> tags in the HTML — they're loaded
                // by app-shell on /en-gb/app. Patch dataSource.getFileBytes so that
                // send-browse's iframe preview also gets them injected, matching
                // /en-gb/app rendering exactly (same technique as app-shell._mountApp).
                if (config.resources && autoOpen) {
                    var _cssPaths = config.resources.css || [];
                    var _jsPaths  = config.resources.js  || [];
                    if (_cssPaths.length || _jsPaths.length) {
                        var _vaultText = async function (p) {
                            var norm = p.startsWith('/') ? p.slice(1) : p;
                            var fe   = fileList.find(function (f) { return f.path === norm; });
                            if (!fe) return '';
                            try {
                                var b = await dataSource.getFileBytes(fe.path);
                                return new TextDecoder().decode(b);
                            } catch (_) { return ''; }
                        };
                        var _cssTexts = await Promise.all(_cssPaths.map(_vaultText));
                        var _jsTexts  = await Promise.all(_jsPaths.map(_vaultText));
                        var _resBlock = '';
                        _cssTexts.forEach(function (css) {
                            if (css) _resBlock += '<style data-sg-app>' + css.replace(/<\/style>/gi, '<\\/style>') + '</style>';
                        });
                        _jsTexts.forEach(function (js) {
                            if (js) _resBlock += '<script data-sg-app>' + js.replace(/<\/script>/gi, '<\\/script>') + '<\/script>';
                        });
                        if (_resBlock) {
                            var _origGFB = dataSource.getFileBytes.bind(dataSource);
                            dataSource.getFileBytes = async function (path) {
                                var bytes = await _origGFB(path);
                                var norm  = path.startsWith('/') ? path.slice(1) : path;
                                if (norm === entryFile || norm.endsWith('/' + entryFile)) {
                                    var html     = new TextDecoder().decode(bytes);
                                    var injected = html.replace(/(<head[^>]*>)/i, '$1' + _resBlock);
                                    if (injected === html) injected = _resBlock + html;
                                    return new TextEncoder().encode(injected).buffer;
                                }
                                return bytes;
                            };
                            console.log('[app.json] resources injected into vault preview: css=' + _cssPaths.length + ' js=' + _jsPaths.length);
                        }
                    }
                }

                // Auto-open entry file in the vault file browser
                if (autoOpen && browse && browse._openFileTab) {
                    requestAnimationFrame(function () {
                        browse._openFileTab(entryFile);
                    });
                }
            };

            // ── 4. _setupVaultLinkHandler ──────────────────────────────────────────────
            // Change 4b: intercept relative <a> clicks in the vault DOM (including markdown
            // present-mode / page-layout-renderer) and open the target in send-browse.
            // Only fires for paths that exist in the vault file list.
            VaultShell.prototype._setupVaultLinkHandler = function (dataSource, browse) {
                var fileList = dataSource.getFileList();
                var self = this;

                // Remove any previous handler
                if (this._vaultLinkHandler) {
                    this.removeEventListener('click', this._vaultLinkHandler, true);
                }

                this._vaultLinkHandler = function (e) {
                    var a = e.target.closest('a');
                    if (!a) return;
                    var href = a.getAttribute('href');
                    if (!href) return;
                    // Skip absolute URLs, same-page anchors, javascript:, mailto:
                    if (href.startsWith('http') || href.startsWith('//') ||
                        href.startsWith('#') || href.startsWith('mailto:') ||
                        href.startsWith('javascript:')) return;

                    // Strip leading slash and find in file list (case-insensitive)
                    var clean = href.replace(/^\//, '');
                    var match = fileList.find(function (f) {
                        return f.path === clean || f.path === href;
                    });
                    if (!match) return;

                    e.preventDefault();
                    console.log('[vault-link] opening in browse:', match.path);
                    if (browse._openFileTab) browse._openFileTab(match.path);
                };

                this.addEventListener('click', this._vaultLinkHandler, true);
            };
        }());

        // Rename "⇌ Vaults" → "Open or Create Vault" and style as a teal navigation button.
        // Placed first in .vh-right (order:-1) so it reads as navigation rather than an action.
        (function () {
            var header  = document.querySelector('vault-shell vault-header');
            var lockBtn = header && header.shadowRoot && header.shadowRoot.querySelector('.vh-lock-btn');
            if (lockBtn) {
                lockBtn.textContent = 'Open or Create Vault';
                lockBtn.title       = 'Open or create a vault';
                lockBtn.style.cssText = [
                    'order:-1',
                    'color:#4ecdc4',
                    'border-color:rgba(78,205,196,0.4)',
                    'margin-right:0.75rem',
                    'font-weight:600'
                ].join(';');
            }
        }());

        // Patch VaultEntry._onSimpleTokenOpen:
        //   - When sg-vault-creating is set (new vault from landing page), create instead of open
        //   - When auto-opening from LS key (set by root routing script), show full-page error on failure
        //   - When the user manually typed a token and clicked, show the usual inline error
        var _orig = VaultEntry.prototype._onSimpleTokenOpen;
        VaultEntry.prototype._onSimpleTokenOpen = async function () {
            var token       = this._simpleTokenInput.value.trim().toLowerCase();
            var createToken = VaultLoader.storage.getCreatingFlag();

            // Create-vault flow (redirected from landing page)
            if (createToken && createToken === token) {
                VaultLoader.storage.clearCreatingFlag();
                var accessKey = this._accessKeyInput.value.trim();
                if (!accessKey) {
                    _removeSplash();
                    _revealEntry();
                    this._showError('An access key is required to create a new vault.');
                    this._accessKeyInput.focus();
                    return;
                }
                this._hideError();
                try {
                    // Name uses a friendly date/time — NOT the token.
                    var now       = new Date();
                    var dateStr   = now.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
                    var timeStr   = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
                    var vaultName = 'New Vault (' + dateStr + ' · ' + timeStr + ')';
                    var result = await VaultLoader.create(token, {
                        name:      vaultName,
                        accessKey: accessKey,
                        endpoint:  this._endpointInput.value.trim() || undefined
                    });

                    window.history.replaceState(null, '', '/en-gb/vault');
                    try { sessionStorage.setItem('sg-vault-session', token); } catch (_) {}

                    _removeSplash();
                    this.emit('vault-created', { vault: result.vault, vaultKey: result.vaultKey });
                } catch (err) {
                    VaultLoader.storage.setCreatingFlag(token); // restore flag for retry
                    _removeSplash();
                    _revealEntry();
                    this._showError('Failed to create vault: ' + err.message);
                }
                return;
            }

            // Detect whether this is an auto-open triggered by the LS key
            // (set by root routing script when a share-link /#token arrived).
            var storedToken = (VaultLoader.storage.getCurrentKey() || '').toLowerCase();
            var isAutoOpen  = !!storedToken && storedToken === token;

            if (!isAutoOpen) {
                // Manual open — delegate to original for standard inline error handling
                return _orig.call(this);
            }

            // Auto-open: any failure shows the full-page error
            this._hideError();
            this._showStatus('Opening vault…');
            this._simpleTokenBtn.disabled = true;
            try {
                await this._openVault(token, token);
                try { sessionStorage.setItem('sg-vault-session', token); } catch (_) {}
            } catch (err) {
                _showAutoOpenErrorPage(token, err);
            } finally {
                this._simpleTokenBtn.disabled = false;
                this._hideStatus();
            }
        };
    })();
    </script>

</body>
</html>
